<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER X - Đăng ký</title>
    <link rel="stylesheet" href="../asset/CSS/dangKy.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script defer src="../asset/JS/main.js"></script>
</head>
<body>
    <a href="../index.html" class="btn-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Quay về</a>

    <div class="auth-card">
        <a href="../index.html" class="logo">SNEAKER X</a>
        <h2>Đăng ký thành viên</h2>
        <form id="registerForm" novalidate>
            <div class="form-group"><label>Tên hiển thị</label><input type="text" id="name" placeholder="Họ và tên của bạn"></div>
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="example@gmail.com"></div>
            <div class="form-group"><label>Số điện thoại</label><input type="tel" id="phone" placeholder="09xxxxxxxx (10 số)"></div>
            <div class="form-group"><label>Tên đăng nhập</label><input type="text" id="username" placeholder="Tên để đăng nhập (Không dấu)"></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="password" placeholder="Tối thiểu 6 ký tự"></div>
            <button type="submit" class="btn-submit">TẠO TÀI KHOẢN</button>
        </form>
        <div id="message"></div>
        <div class="switch-auth">Đã có tài khoản? <a href="../pages/dangNhap.html">Đăng nhập ngay</a></div>
    </div>
</body>
</html>
