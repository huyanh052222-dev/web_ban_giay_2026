<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER X - Đăng nhập</title>
    <link rel="stylesheet" href="./dangNhap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script defer src="./main.js"></script>
</head>
<body>
    <a href="index.html" class="btn-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Quay về</a>

    <div class="auth-card">
        <a href="index.html" class="logo">SNEAKER X</a>
        <h2>Đăng nhập</h2>
        <form id="loginForm" novalidate>
            <div class="form-group"><label>Tên đăng nhập</label><input type="text" id="username" required placeholder="Nhập tên tài khoản"></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="password" required placeholder="••••••••"></div>
            <button type="submit" class="btn-submit">BẮT ĐẦU TRẢI NGHIỆM</button>
        </form>
        <div id="message"></div>
        <div class="switch-auth">Chưa có tài khoản? <a href="dangKy.html">Đăng ký ngay</a></div>
    </div>

</body>
</html>
