<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER X - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #ffffff; --text-color: #1a1a1a; --secondary-bg: #f5f5f7; }
        [data-theme="dark"] { --bg-color: #050505; --text-color: #f5f5f7; --secondary-bg: #151515; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg-color); color: var(--text-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; transition: 0.3s; position: relative; }
        
        .btn-back {
            position: absolute; top: 40px; left: 5%;
            text-decoration: none; color: var(--text-color);
            font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
            opacity: 0.6; transition: 0.3s;
        }
        .btn-back:hover { opacity: 1; transform: translateX(-5px); }

        .auth-card { background: var(--bg-color); border: 1px solid rgba(128,128,128,0.1); padding: 50px; border-radius: 30px; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .logo { font-weight: 800; font-size: 1.5rem; text-align: center; margin-bottom: 30px; display: block; text-decoration: none; color: var(--text-color); }
        h2 { font-size: 1.5rem; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; opacity: 0.7; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(128,128,128,0.2); background: var(--secondary-bg); color: var(--text-color); outline: none; transition: 0.3s; }
        input:focus { border-color: var(--text-color); }
        .btn-submit { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--text-color); color: var(--bg-color); font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        
        .switch-auth { text-align: center; margin-top: 20px; font-size: 0.9rem; opacity: 0.7; }
        .switch-auth a { color: var(--text-color); font-weight: 700; text-decoration: none; }
        #message { margin-top: 15px; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Quay về trang chủ
    </a>

    <div class="auth-card">
        <a href="index.html" class="logo">SNEAKER X</a>
        <h2>Đăng nhập</h2>
        <form id="loginForm">
            <div class="form-group"><label>Tên đăng nhập</label><input type="text" id="username" required placeholder="Tên tài khoản"></div>
            <div class="form-group"><label>Mật khẩu</label><input type="password" id="password" required placeholder="••••••••"></div>
            <button type="submit" class="btn-submit">ĐĂNG NHẬP</button>
        </form>
        <div id="message"></div>
        <div class="switch-auth">Chưa có tài khoản? <a href="dangKy.html">Đăng ký ngay</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('message');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            try {
                // Kiểm tra tài khoản bằng API json-server
                const response = await fetch(`http://localhost:3000/users?username=${encodeURIComponent(u)}`);
                const data = await response.json();

                if (data.length > 0) {
                    if (data[0].password === p) {
                        localStorage.setItem('isLoggedIn', 'true');
                        // Ưu tiên lấy 'name', nếu không có thì lấy 'username' để tương thích dữ liệu cũ
                        const userName = data[0].name || data[0].username;
                        localStorage.setItem('user', JSON.stringify({ ...data[0], name: userName }));
                        
                        msg.style.display = 'block'; msg.style.color = '#00c851'; msg.innerText = "Đăng nhập thành công!";
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    } else {
                        msg.style.display = 'block'; msg.style.color = '#ff4444'; msg.innerText = "Sai mật khẩu, vui lòng thử lại!";
                    }
                } else {
                    const localUsers = JSON.parse(localStorage.getItem('local_users')) || [];
                    const found = localUsers.find(user => user.username === u);
                    
                    if (found && found.password === p) {
                        localStorage.setItem('isLoggedIn', 'true');
                        const userName = found.name || found.username;
                        localStorage.setItem('user', JSON.stringify({ ...found, name: userName }));
                        window.location.href = 'index.html';
                    } else if (u === 'admin' && p === '123') { // Tài khoản Hardcode fallback
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('user', JSON.stringify({ name: 'Admin Manager', username: 'admin' }));
                        window.location.href = 'index.html';
                    } else {
                        msg.style.display = 'block'; msg.style.color = '#ff4444'; msg.innerText = "Tài khoản không tồn tại!";
                    }
                }
            } catch (err) {
                msg.style.display = 'block'; msg.style.color = '#ff4444'; msg.innerText = "Lỗi kết nối Server!";
            }
        });

        // Tự động áp dụng theme nếu người dùng đã chỉnh ở trang chủ
        if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
    </script>
</body>
</html>
